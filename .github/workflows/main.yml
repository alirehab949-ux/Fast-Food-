name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create pabloApp com.pablo.escobareclient "Pablo Escobare Client"
          cd pabloApp
          rm -rf www/*
          cp ../index.html www/
          cordova plugin add cordova-plugin-geolocation
          cordova plugin add cordova-plugin-android-permissions
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pablo-Escobare-APK
          path: pabloApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
