<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pablo Escobare | Premium Experience</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap');

    :root {
      --bg-deep: #030305;
      --card-bg-gradient: linear-gradient(145deg, rgba(25, 25, 35, 0.6) 0%, rgba(10, 10, 15, 0.8) 100%);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-highlight: rgba(255, 255, 255, 0.1);
      
      --red-neon: #ff0044;
      --red-dark: #b30030;
      --red-glow: rgba(255, 0, 68, 0.5);
      
      --gold-neon: #ffb700;
      --gold-glow: rgba(255, 183, 0, 0.4);
      
      --text-main: #ffffff;
      --text-sub: #9e9ea7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
      overflow-x: hidden;
      position: relative;
    }

    /* Cinematic Animated Background */
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1;
      animation: float 20s infinite ease-in-out alternate;
    }
    body::before {
      width: 400px; height: 400px; background: rgba(255, 0, 68, 0.05);
      top: -100px; left: -100px;
    }
    body::after {
      width: 300px; height: 300px; background: rgba(255, 183, 0, 0.03);
      bottom: 20%; right: -50px; animation-delay: -10s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.2); }
    }

    /* Header - Premium Glass */
    header {
      background: rgba(5, 5, 8, 0.7);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--card-border);
      padding: 15px; display: flex; justify-content: center; align-items: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-logo {
      font-size: 1.6rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; display: flex; gap: 8px;
    }

    .text-white {
      background: linear-gradient(90deg, #aaa 0%, #fff 50%, #aaa 100%);
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
    }
    .text-red {
      background: linear-gradient(90deg, var(--red-dark) 0%, var(--red-neon) 50%, var(--red-dark) 100%);
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite reverse;
    }
    @keyframes shine { to { background-position: 200% center; } }

    /* Auth Screen - Luxury Card */
    #auth-screen {
      position: fixed; inset: 0; background: rgba(3, 3, 5, 0.9);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .auth-box {
      background: var(--card-bg-gradient);
      border: 1px solid var(--card-highlight);
      padding: 40px 30px; border-radius: 30px; width: 100%; max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      text-align: center; position: relative; overflow: hidden;
    }
    .auth-box::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at top, rgba(255,0,68,0.15), transparent 60%); z-index: 0;
    }
    .auth-box > * { position: relative; z-index: 1; }
    
    .auth-box h2 {
      font-weight: 900; font-size: 1.6rem; margin-bottom: 30px;
      background: linear-gradient(to right, #fff, #bbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .auth-input {
      width: 100%; padding: 16px 20px; margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
      border-radius: 16px; color: #fff; font-size: 1rem; font-weight: 600; outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: center; letter-spacing: 1px;
    }
    .auth-input:focus {
      border-color: var(--red-neon); box-shadow: 0 0 20px rgba(255, 0, 68, 0.2);
      transform: translateY(-2px); background: rgba(0, 0, 0, 0.6);
    }
    .auth-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%); color: #000;
      border: none; border-radius: 16px; font-weight: 900; cursor: pointer;
      font-size: 1rem; text-transform: uppercase; letter-spacing: 1.5px;
      transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(255,255,255,0.1);
    }
    .auth-btn:hover, .auth-btn:active { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 25px rgba(255,255,255,0.2); }

    /* Nav & Filters */
    .nav-tabs {
      display: flex; justify-content: center; gap: 10px; padding: 15px;
      background: linear-gradient(to bottom, rgba(5,5,8,0.7), transparent);
      position: sticky; top: 60px; z-index: 90;
    }
    .tab-btn {
      flex: 1;
      justify-content: center;
      background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); color: var(--text-sub);
      padding: 12px 10px; border-radius: 20px; font-weight: 800; cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-size: 0.85rem;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--red-neon); color: #fff; border-color: var(--red-neon);
      box-shadow: 0 8px 20px var(--red-glow); transform: scale(1.02);
    }
    #orders-badge {
      background: #000; color: #fff; border-radius: 50%; padding: 2px 7px;
      font-size: 0.75rem; font-weight: 900;
    }
    .tab-btn.active #orders-badge { background: #fff; color: var(--red-neon); }

    .category-tabs {
      display: flex; gap: 8px; justify-content: center; padding: 15px 0; margin-bottom: 10px;
    }
    .cat-btn {
      flex: 1; max-width: 140px; padding: 12px 8px;
      background: var(--card-bg-gradient); border: 1px solid var(--card-border);
      color: var(--text-sub); border-radius: 16px;
      font-size: 0.8rem; font-weight: 800; cursor: pointer;
      transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      white-space: nowrap;
    }
    .cat-btn.active {
      background: rgba(255, 0, 68, 0.1); color: #fff; border-color: var(--red-neon);
      box-shadow: 0 0 15px rgba(255, 0, 68, 0.15), inset 0 0 10px rgba(255,0,68,0.1);
      transform: translateY(-2px);
    }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 15px; }
    .page { display: none; }
    .page.active { display: block; animation: fadeSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* High-End Cards Menu */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .food-card {
      background: var(--card-bg-gradient); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 20px; position: relative;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }
    .food-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      pointer-events: none;
    }
    .food-card:hover { 
      transform: translateY(-5px); 
      border-color: rgba(255, 0, 68, 0.3);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,0,68,0.1);
    }
    .food-card.pack-card { border-top: 2px solid var(--gold-neon); border-color: rgba(255, 183, 0, 0.2); }
    .food-card.pack-card:hover { border-color: var(--gold-neon); box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,183,0,0.15); }

    .badge {
      position: absolute; top: 15px; right: 15px;
      background: linear-gradient(135deg, var(--red-neon), var(--red-dark)); color: #fff;
      font-size: 0.65rem; font-weight: 900; padding: 6px 12px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px var(--red-glow);
    }
    .pack-card .badge { background: linear-gradient(135deg, var(--gold-neon), #d49800); color: #000; box-shadow: 0 4px 10px var(--gold-glow); }

    .food-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 8px; margin-right: 70px; line-height: 1.2; }
    .food-desc { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; font-weight: 400; }
    
    .card-bottom {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: auto;
    }
    .price { font-size: 1.2rem; font-weight: 900; color: #fff; }
    .price small { font-size: 0.75rem; color: var(--red-neon); }

    .btn-add {
      background: rgba(255, 0, 68, 0.1); color: var(--red-neon);
      border: 1px solid var(--red-neon); padding: 8px 16px; border-radius: 12px;
      font-weight: 800; cursor: pointer; font-size: 0.85rem;
      transition: all 0.3s ease; white-space: nowrap;
    }
    .btn-add:hover { background: var(--red-neon); color: #fff; box-shadow: 0 5px 15px var(--red-glow); }
    .pack-card .btn-add { color: var(--gold-neon); border-color: var(--gold-neon); background: rgba(255,183,0,0.1); }
    .pack-card .btn-add:hover { background: var(--gold-neon); color: #000; box-shadow: 0 5px 15px var(--gold-glow); }

    /* Orders Card Design */
    .order-card {
      background: var(--card-bg-gradient); border: 1px solid var(--card-border);
      border-left: 4px solid var(--red-neon); border-radius: 16px;
      padding: 20px; backdrop-filter: blur(20px); position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px;
    }
    .order-id { color: var(--red-neon); font-weight: 900; font-size: 1rem; letter-spacing: 0.5px; }
    .order-time { color: var(--text-sub); font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
    
    .order-items-list {
      background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px;
      font-size: 0.85rem; color: #ccc; margin: 12px 0; line-height: 1.8;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .btn-delete-order {
      background: rgba(255, 0, 68, 0.1); color: var(--red-neon); border: 1px dashed var(--red-neon);
      padding: 10px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; cursor: pointer;
      transition: all 0.3s ease; width: 100%; margin-top: 12px; text-transform: uppercase;
    }
    .btn-delete-order:hover { background: var(--red-neon); color: #fff; border-style: solid; }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed; bottom: 15px; left: 15px; right: 15px; max-width: 800px; margin: 0 auto;
      background: rgba(15, 15, 22, 0.92); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 20px rgba(255,0,68,0.2);
    }
    .cart-info { display: flex; align-items: center; gap: 10px; flex-shrink: 1; }
    
    .btn-view-cart {
      background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px; border-radius: 14px; cursor: pointer; font-size: 0.85rem; font-weight: 800;
      display: flex; align-items: center; gap: 6px; transition: 0.3s;
      white-space: nowrap;
    }
    
    .cart-total-display { 
      display: flex; flex-direction: column; line-height: 1.1; 
      white-space: nowrap;
    }
    .cart-total-display span { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; font-weight: 800; }
    .cart-total-display strong { font-size: 1.15rem; color: #fff; font-weight: 900; }
    .cart-total-display strong small { color: var(--red-neon); font-size: 0.75rem; }

    .checkout-btn {
      background: linear-gradient(135deg, var(--red-neon), var(--red-dark)); color: #fff;
      border: none; padding: 12px 18px; border-radius: 16px; font-weight: 900; cursor: pointer;
      font-size: 0.9rem; box-shadow: 0 6px 15px var(--red-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: pulseCart 2s infinite; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; flex-shrink: 0;
    }
    .checkout-btn:active { transform: scale(0.95); }
    @keyframes pulseCart {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(255, 0, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 68, 0); }
    }

    #shop-status-banner {
      background: linear-gradient(90deg, #b30000, #ff0044); color: #fff; text-align: center;
      padding: 10px; font-weight: 900; font-size: 0.85rem; display: none; text-transform: uppercase; letter-spacing: 1px;
    }

    /* Modal - Premium Overlay */
    #cart-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      z-index: 3000; justify-content: center; align-items: flex-end; padding: 15px;
    }
    .cart-modal-content {
      background: var(--card-bg-gradient); border: 1px solid var(--card-highlight);
      padding: 25px; border-radius: 25px 25px 20px 20px; width: 100%; max-width: 500px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 -20px 50px rgba(0,0,0,0.9);
      animation: slideUpModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes slideUpModal {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .cart-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .btn-close-modal {
      background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);
      padding: 14px; width: 100%; border-radius: 14px; margin-top: 20px; cursor: pointer;
      font-weight: 900; font-size: 0.95rem; text-transform: uppercase; transition: 0.3s;
    }
    .btn-close-modal:hover { background: rgba(255,255,255,0.1); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 10px; }

    /* الإطار الرئيسي مع من */
    .espace-police-frame {
        position: relative;
        background: rgba(20, 20, 28, 0.4); 
        backdrop-filter: blur(20px) saturate(120%); 
        -webkit-backdrop-filter: blur(20px) saturate(120%);
        border-radius: 24px;
        padding: 40px 30px;
        z-index: 1; 
        
        display: flex;
        flex-direction: column; 
        align-items: center;
        justify-content: center;
        gap: 24px; 
        
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        
        /* المقص الذي يمنع الأضواء من الخروج للشاشة */
        overflow: hidden; 
        
        width: 90%;
        max-width: 400px;
        margin: 60px auto; 
    }

    .espace-police-frame input,
    .espace-police-frame button {
        width: 100%;
    }

    /* إعدادات الأضواء (جاهزة للسباحة) */
    .espace-police-frame::before,
    .espace-police-frame::after {
        content: "";
        position: absolute;
        width: 250px; 
        height: 250px;
        z-index: -1;
        filter: blur(60px); 
        border-radius: 50%;
        opacity: 0.85;
        transform: translate(-50%, -50%);
    }

    /* الضوء الأحمر */
    .espace-police-frame::before {
        background: #ff0000; 
        animation: randomSwimRed 12s infinite ease-in-out;
    }

    /* الضوء الأزرق */
    .espace-police-frame::after {
        background: #0011ff; 
        animation: randomSwimBlue 14s infinite ease-in-out;
    }

    /* مسارات السباحة العشوائية */
    @keyframes randomSwimRed {
        0%   { top: 10%; left: 10%; }
        25%  { top: 80%; left: 80%; }
        50%  { top: 30%; left: 90%; }
        75%  { top: 90%; left: 20%; }
        100% { top: 10%; left: 10%; }
    }

    @keyframes randomSwimBlue {
        0%   { top: 90%; left: 90%; }
        25%  { top: 10%; left: 30%; }
        50%  { top: 80%; left: 10%; }
        75%  { top: 20%; left: 80%; }
        100% { top: 90%; left: 90%; }
    }

    /* إطار العنوان العلوي */
    .pablo-police-frame {
        position: relative;
        background: rgba(20, 20, 28, 0.4); 
        backdrop-filter: blur(20px) saturate(120%); 
        -webkit-backdrop-filter: blur(20px) saturate(120%);
        border-radius: 0 0 24px 24px;
        padding: 20px 15px;
        z-index: 10; 
        display: flex;
        justify-content: center; 
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-top: none; 
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        overflow: hidden; 
        width: 100%;
        max-width: 100%;
        margin: 0; 
    }

    .pablo-police-frame span {
        font-size: 1.8rem !important;
        font-weight: 900 !important;
        letter-spacing: 1.5px;
    }

    .pablo-police-frame .text-white { color: #ffffff; }
    .pablo-police-frame .text-red { color: #ff1e38; }

    .pablo-police-frame::before,
    .pablo-police-frame::after {
        content: "";
        position: absolute;
        width: 250px; 
        height: 250px;
        z-index: -1;
        filter: blur(55px);
        border-radius: 50%;
        opacity: 0.85;
        transform: translate(-50%, -50%);
    }

    .pablo-police-frame::before {
        background: #FF0000A8; 
        animation: randomSwimRed 12s infinite ease-in-out;
    }

    .pablo-police-frame::after {
        background: #0011FFA8; 
        animation: randomSwimBlue 14s infinite ease-in-out;
    }

    /* --- Custom Alert & Confirm Dialogs --- */
    .dialog-overlay {
      position: fixed; inset: 0;
      background: rgba(3, 3, 5, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex; justify-content: center; align-items: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .dialog-overlay.show {
      opacity: 1; pointer-events: auto;
    }
    .dialog-box {
      background: var(--card-bg-gradient);
      border: 1px solid rgba(255, 0, 68, 0.3);
      box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255,0,68,0.15);
      padding: 30px 25px; border-radius: 24px;
      width: 100%; max-width: 350px; text-align: center;
      transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .dialog-overlay.show .dialog-box {
      transform: scale(1);
    }
    .dialog-title {
      font-size: 1.3rem; font-weight: 900; color: #fff; margin-bottom: 10px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .dialog-message {
      font-size: 0.95rem; color: var(--text-sub); margin-bottom: 25px; line-height: 1.5; font-weight: 600;
    }
    .dialog-actions {
      display: flex; gap: 10px; justify-content: center;
    }
    .dialog-btn {
      flex: 1; padding: 12px; border-radius: 14px; font-weight: 800;
      font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase;
    }
    .dialog-btn.confirm-btn {
      background: linear-gradient(135deg, var(--red-neon), var(--red-dark));
      color: #fff; border: none; box-shadow: 0 5px 15px var(--red-glow);
    }
    .dialog-btn.confirm-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,0,68,0.6); }
    .dialog-btn.cancel-btn {
      background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);
    }
    .dialog-btn.cancel-btn:hover { background: rgba(255,255,255,0.1); }

  </style>
</head>
<body>

  <div id="auth-screen">
   <div class="espace-police-frame">
      <h2>Espace Client</h2>
      <input type="tel" id="user-phone" class="auth-input" placeholder="Numéro (ex: 06...)">
      <button class="auth-btn" onclick="loginUser()">Accéder au Menu</button>
    </div>
  </div>

  <div id="shop-status-banner">
    ⚠️ Le restaurant est actuellement fermé ⚠️
  </div>

  <header>
    <div class="pablo-police-frame">
        <span class="text-white">PABLO</span> 
        <span class="text-red">ESCOBARE</span>
    </div>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('menu-page', this)">🍽 Menu & Packs</button>
    <button class="tab-btn" onclick="switchTab('orders-page', this)">
      🧾 Commandes <span id="orders-badge">0</span>
    </button>
  </div>

  <div class="container">
    <div id="menu-page" class="page active">
      <div class="category-tabs">
        <button class="cat-btn active" onclick="filterCategory('food', this)">Repas 🍔</button>
        <button class="cat-btn" onclick="filterCategory('drink', this)">Boissons 🥤</button>
        <button class="cat-btn" onclick="filterCategory('pack', this)">Packs 🔥</button>
      </div>

      <div class="menu-grid" id="menu-grid"></div>
    </div>

    <div id="orders-page" class="page">
      <h2 style="margin: 10px 0 20px 0; font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color:#fff;">Suivi des commandes</h2>
      <div id="orders-list" style="display:flex; flex-direction:column; gap:0;"></div>
    </div>
  </div>

  <!-- The Fixed Bottom Cart Bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <button class="btn-view-cart" onclick="openCartModal()">
        🛒 Panier (<span id="cart-count">0</span>)
      </button>
      <div class="cart-total-display">
        <span>Total</span>
        <strong><span id="cart-total">0</span> <small>DA</small></strong>
      </div>
    </div>
    <button class="checkout-btn" onclick="sendOrderWithGPS()">Commander</button>
  </div>

  <div id="cart-modal">
    <div class="cart-modal-content">
      <h3 style="margin-bottom:20px; color:var(--text-main); font-size:1.3rem; font-weight:900; display:flex; justify-content:space-between; align-items:center;">
        Votre Panier
        <span style="font-size:0.85rem; color:var(--red-neon); font-weight:700; cursor:pointer;" onclick="closeCartModal()">Fermer X</span>
      </h3>
      <div id="cart-items-container"></div>
      <button onclick="closeCartModal()" class="btn-close-modal">Continuer les achats</button>
    </div>
  </div>

  <!-- Custom Dialog Box Structure -->
  <div id="custom-dialog-overlay" class="dialog-overlay">
    <div class="dialog-box">
      <div class="dialog-title" id="dialog-title">Alerte</div>
      <div class="dialog-message" id="dialog-message">Message ici</div>
      <div class="dialog-actions">
        <button id="dialog-btn-cancel" class="dialog-btn cancel-btn">Annuler</button>
        <button id="dialog-btn-confirm" class="dialog-btn confirm-btn">OK</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBVyedQY7ghVfVWTFVgMtx7KFTKz-8bepQ",
      authDomain: "pablo-7372e.firebaseapp.com",
      projectId: "pablo-7372e",
      storageBucket: "pablo-7372e.firebasestorage.app",
      messagingSenderId: "395777904599",
      appId: "1:395777904599:web:a1e3a4ce578ca31c2cc592"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let cart = [];
    let userCoords = null;
    let allMenuItems = [];
    let currentCategory = 'food';

    // --- Custom Alert & Confirm Functions ---
    window.customAlert = function(message, title = "Alerte") {
      return new Promise((resolve) => {
        const overlay = document.getElementById('custom-dialog-overlay');
        document.getElementById('dialog-title').innerText = title;
        document.getElementById('dialog-message').innerText = message;
        
        const btnCancel = document.getElementById('dialog-btn-cancel');
        const btnConfirm = document.getElementById('dialog-btn-confirm');
        
        btnCancel.style.display = 'none'; // إخفاء زر الإلغاء في التنبيهات العادية
        btnConfirm.innerText = "OK";
        overlay.classList.add('show');
        
        const handleConfirm = () => {
          overlay.classList.remove('show');
          btnConfirm.removeEventListener('click', handleConfirm);
          resolve(true);
        };
        btnConfirm.addEventListener('click', handleConfirm);
      });
    };

    window.customConfirm = function(message, title = "Confirmation") {
      return new Promise((resolve) => {
        const overlay = document.getElementById('custom-dialog-overlay');
        document.getElementById('dialog-title').innerText = title;
        document.getElementById('dialog-message').innerText = message;
        
        const btnCancel = document.getElementById('dialog-btn-cancel');
        const btnConfirm = document.getElementById('dialog-btn-confirm');
        
        btnCancel.style.display = 'block'; // إظهار زر الإلغاء
        btnConfirm.innerText = "Confirmer";
        overlay.classList.add('show');
        
        const handleCancel = () => { cleanup(); resolve(false); };
        const handleConfirm = () => { cleanup(); resolve(true); };
        
        const cleanup = () => {
          overlay.classList.remove('show');
          btnCancel.removeEventListener('click', handleCancel);
          btnConfirm.removeEventListener('click', handleConfirm);
        };
        
        btnCancel.addEventListener('click', handleCancel);
        btnConfirm.addEventListener('click', handleConfirm);
      });
    };

    // --- Core App Functions ---

    window.loginUser = async function() {
      const phone = document.getElementById('user-phone').value.trim();
      if(!phone) { 
        await customAlert("Veuillez saisir votre numéro de téléphone.", "Erreur"); 
        return; 
      }
      
      currentUser = phone;
      document.getElementById('auth-screen').style.display = 'none';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
        }, () => {});
      }
      loadMenuAndSettings();
    };

    window.switchTab = function(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      btn.classList.add('active');
    };

    window.filterCategory = function(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    };

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      const filtered = allMenuItems.filter(item => item.type === currentCategory);

      if(filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-sub); padding:30px; font-weight:600; background:var(--card-bg-gradient); border-radius:16px; border:1px solid var(--card-border);">Bientôt disponible...</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isPack = item.type === 'pack';
        return `
          <div class="food-card ${isPack ? 'pack-card' : ''}">
            <span class="badge">${item.badge || (isPack ? 'PACK VIP' : (item.type === 'drink' ? 'Boisson' : 'Spécial'))}</span>
            <div>
              <h3 class="food-title">${item.name}</h3>
              <p class="food-desc">${item.desc || ''}</p>
            </div>
            <div class="card-bottom">
              <span class="price">${item.price} <small>DA</small></span>
              <button class="btn-add" onclick='addToCart(${JSON.stringify(item)})'>+ Ajouter</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function getStatusBadgeStyle(status) {
      const st = (status || '').toLowerCase();
      if (st.includes('تحضير') || st.includes('préparation')) {
        return { text: status, style: 'background:rgba(0, 183, 255, 0.15); color:#00c3ff; border:1px solid rgba(0, 183, 255, 0.4);' };
      }
      if (st.includes('طريق') || st.includes('route')) {
        return { text: status, style: 'background:rgba(255, 120, 0, 0.15); color:#ff7800; border:1px solid rgba(255, 120, 0, 0.4);' };
      }
      if (st.includes('توصيل') || st.includes('livré')) {
        return { text: status, style: 'background:rgba(0, 255, 136, 0.15); color:#00ff88; border:1px solid rgba(0, 255, 136, 0.4);' };
      }
      return { text: status || 'En attente', style: 'background:rgba(255, 183, 0, 0.15); color:#ffb700; border:1px solid rgba(255, 183, 0, 0.4);' };
    }

    async function loadMenuAndSettings() {
      const settingsSnap = await getDoc(doc(db, "settings", "shop"));
      if(settingsSnap.exists() && settingsSnap.data().isOpen === false) {
        document.getElementById('shop-status-banner').style.display = 'block';
      }

      onSnapshot(collection(db, "menu"), (snapshot) => {
        allMenuItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMenu();
      });

      onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
        const container = document.getElementById('orders-list');
        const myOrders = snapshot.docs.filter(d => d.data().phone === currentUser);
        document.getElementById('orders-badge').innerText = myOrders.length;

        if(myOrders.length === 0) {
          container.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:30px; font-weight:600; background:var(--card-bg-gradient); border-radius:16px; border:1px solid var(--card-border);">Aucune commande.</div>`;
          return;
        }

        container.innerHTML = myOrders.map(docSnap => {
          const ord = docSnap.data();
          const orderId = docSnap.id;
          const statusText = ord.status || 'En attente';
          const isPending = statusText.toLowerCase().includes('attente') || statusText.toLowerCase().includes('انتظار');
          const badgeConfig = getStatusBadgeStyle(statusText);

          return `
            <div class="order-card">
              <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span class="order-id">Commande #${orderId.slice(-4)}</span>
                <span class="order-time">⏳ ${ord.time || ''}</span>
              </div>
              <div class="order-items-list">
                ${ord.items.map(i => `<div style="margin-bottom:4px;">• ${i.name} <span style="float:right; color:#fff; font-weight:700;">${i.price} DA</span></div>`).join('')}
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.05); padding-top:12px; margin-top:12px;">
                <strong style="font-size:1.1rem; color:#fff;">Total: ${ord.total} DA</strong>
                <span style="${badgeConfig.style} padding:6px 14px; border-radius:15px; font-size:0.75rem; font-weight:900;">
                  ${badgeConfig.text}
                </span>
              </div>
              ${isPending ? `<button class="btn-delete-order" onclick="cancelOrder('${orderId}')">Annuler la commande ✕</button>` : ''}
            </div>
          `;
        }).join('');
      });
    }

    window.cancelOrder = async function(orderId) {
      const isConfirmed = await customConfirm("Voulez-vous annuler cette commande ?", "Annulation");
      if(isConfirmed) {
        try { await deleteDoc(doc(db, "orders", orderId)); } catch(e) {}
      }
    };

    window.addToCart = function(item) { cart.push(item); updateCartUI(); };
    window.removeFromCart = function(index) { cart.splice(index, 1); updateCartUI(); renderCartItems(); };

    function updateCartUI() {
      const total = cart.reduce((sum, i) => sum + Number(i.price), 0);
      document.getElementById('cart-total').innerText = total;
      document.getElementById('cart-count').innerText = cart.length;
    }

    window.openCartModal = function() { renderCartItems(); document.getElementById('cart-modal').style.display = 'flex'; };
    window.closeCartModal = function() { document.getElementById('cart-modal').style.display = 'none'; };

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      if(cart.length === 0) { container.innerHTML = `<div style="text-align:center; color:var(--text-sub); padding:30px;">Votre panier est vide.</div>`; return; }

      container.innerHTML = cart.map((item, index) => `
        <div class="cart-item-row">
          <div>
            <strong style="font-size:1rem; color:#fff;">${item.name}</strong>
            <div style="font-size:0.85rem; color:var(--text-sub); margin-top:4px; font-weight:600;">${item.price} DA</div>
          </div>
          <button style="background:rgba(255,0,68,0.1); color:var(--red-neon); border:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:0.75rem; font-weight:800;" onclick="removeFromCart(${index})">Retirer</button>
        </div>
      `).join('');
    }

    window.sendOrderWithGPS = async function() {
      const settingsSnap = await getDoc(doc(db, "settings", "shop"));
      if(settingsSnap.exists() && settingsSnap.data().isOpen === false) { 
        await customAlert("Le restaurant est fermé.", "Désolé"); 
        return; 
      }
      if(cart.length === 0) { 
        await customAlert("Votre panier est vide !", "Erreur"); 
        return; 
      }

      let coords = userCoords;
      if (navigator.geolocation) {
        try {
          const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true,
              timeout: 8000,
              maximumAge: 0
            });
          });
          coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        } catch (err) {
          console.warn("GPS timeout or permission denied", err);
        }
      }

      const total = cart.reduce((sum, i) => sum + Number(i.price), 0);
      const now = new Date();
      const formattedTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      await addDoc(collection(db, "orders"), {
        phone: currentUser, items: cart, total: total,
        gps: coords || { lat: "غير محدد", lng: "غير محدد" },
        status: "En attente", time: formattedTime, createdAt: serverTimestamp()
      });
      
      cart = []; updateCartUI(); closeCartModal(); document.querySelectorAll('.tab-btn')[1].click();
      
      await customAlert("Commande envoyée avec succès !", "Succès");
    };

  </script>
</body>
</html>
